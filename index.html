<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #1a1a2e; color: #eee; min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; padding: 16px;
}
h1 { font-size: 22px; margin-bottom: 8px; color: #e8c170; letter-spacing: 2px; }
.subtitle { font-size: 12px; color: #888; margin-bottom: 16px; }
.game-wrap { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
.sidebar { width: min(92vw, 320px); display: flex; flex-direction: column; gap: 12px; }
.board {
  display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
  width: min(92vw, 512px); aspect-ratio: 1;
  border: 3px solid #5a4a2a; border-radius: 4px; overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.square {
  position: relative; display: flex; align-items: center; justify-content: center;
  font-size: clamp(24px, 9vw, 44px); cursor: pointer; user-select: none; line-height: 1;
}
.square.light { background: #f0d9b5; }
.square.dark { background: #b58863; }
.square.hill { box-shadow: inset 0 0 0 3px #e8c170; }
.square.hill::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle, rgba(232,193,112,0.15) 0%, transparent 70%);
}
.square.selected::before { content: ''; position: absolute; inset: 0; background: rgba(20,85,30,0.5); }
.square.last-move::before { content: ''; position: absolute; inset: 0; background: rgba(205,210,106,0.4); }
.square.check::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle, rgba(255,0,0,0.5) 0%, transparent 70%);
}
.dot { position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(20,85,30,0.35); pointer-events: none; }
.capture-ring { position: absolute; inset: 4%; border: 4px solid rgba(20,85,30,0.4); border-radius: 50%; pointer-events: none; }
.piece { z-index: 1; }
.piece.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 4px #000, 0 2px 3px rgba(0,0,0,0.9); font-weight: bold; }
.piece.b { color: #1a1a1a; text-shadow: 0 0 2px rgba(255,255,255,0.5); }
.coord { position: absolute; font-size: 10px; font-weight: bold; pointer-events: none; z-index: 2; }
.coord.file { bottom: 2px; right: 4px; }
.coord.rank { top: 2px; left: 4px; }
.square.light .coord { color: #b58863; }
.square.dark .coord { color: #f0d9b5; }
.panel { background: #16213e; border-radius: 8px; padding: 14px; border: 1px solid #2a3a5e; }
.panel h2 { font-size: 14px; color: #e8c170; margin-bottom: 8px; border-bottom: 1px solid #2a3a5e; padding-bottom: 6px; }
.status-line { font-size: 14px; margin: 4px 0; display: flex; justify-content: space-between; }
.status-line .val { color: #e8c170; font-weight: bold; }
.btn { display: block; width: 100%; padding: 10px; margin: 6px 0; border: none; border-radius: 6px; background: #e8c170; color: #1a1a2e; font-size: 14px; font-weight: bold; cursor: pointer; }
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.secondary { background: #3a5a8e; color: #fff; }
.result-banner { text-align: center; font-size: 18px; font-weight: bold; padding: 12px; border-radius: 6px; margin: 8px 0; display: none; }
.result-banner.win-w { background: #2d5a2d; color: #aaffaa; display: block; }
.result-banner.win-b { background: #5a2d2d; color: #ffaaaa; display: block; }
.result-banner.draw { background: #4a4a2d; color: #ffffaa; display: block; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; }
.stats-grid .label { color: #888; }
.stats-grid .num { color: #e8c170; font-weight: bold; text-align: right; }
.gamelog { max-height: 200px; overflow-y: auto; font-size: 12px; font-family: monospace; background: #0f1629; padding: 8px; border-radius: 4px; line-height: 1.6; }
.game-entry { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid #1a2540; }
.progress-bar { height: 6px; background: #0f1629; border-radius: 3px; overflow: hidden; margin-top: 6px; }
.progress-bar .fill { height: 100%; background: #e8c170; width: 0%; transition: width 0.2s; }
.rules-hint { font-size: 11px; color: #777; line-height: 1.5; }
.rules-hint b { color: #e8c170; }
</style>
</head>
<body>

<h1>山巅之王 · King of the Hill</h1>
<div class="subtitle">标准国际象棋走法 + 王踏入中心4格即胜</div>

<div class="game-wrap">
  <div class="board" id="board"></div>
  <div class="sidebar">
    <div class="panel">
      <h2>对局状态</h2>
      <div class="status-line"><span>回合</span><span class="val" id="turnLabel">白方</span></div>
      <div class="status-line"><span>步数</span><span class="val" id="moveCount">0</span></div>
      <div class="result-banner" id="resultBanner"></div>
    </div>
    <div class="panel">
      <h2>控制</h2>
      <button class="btn" id="btnPvE">人机对战（你执白）</button>
      <button class="btn secondary" id="btnNewGame">双人对弈</button>
      <button class="btn secondary" id="btnAI5">AI 对弈 5 局（测试）</button>
      <button class="btn secondary" id="btnStop" disabled>停止自动对局</button>
      <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
    </div>
    <div class="panel">
      <h2>5局统计</h2>
      <div class="stats-grid">
        <span class="label">白方胜</span><span class="num" id="statWW">0</span>
        <span class="label">黑方胜</span><span class="num" id="statBW">0</span>
        <span class="label">和棋</span><span class="num" id="statDraw">0</span>
        <span class="label">将死胜</span><span class="num" id="statMate">0</span>
        <span class="label">登顶胜</span><span class="num" id="statHill">0</span>
        <span class="label">平均回合</span><span class="num" id="statAvgMoves">-</span>
      </div>
    </div>
    <div class="panel">
      <h2>对局记录</h2>
      <div class="gamelog" id="gamelog">点击「AI 对弈 5 局」开始自动测试…</div>
    </div>
    <div class="panel">
      <h2>规则速览</h2>
      <div class="rules-hint">
        <b>山顶</b> = d4 e4 d5 e5（金色框）<br>
        <b>胜法A</b>：将死对方王<br>
        <b>胜法B</b>：己方王合法走入山顶<br>
        其余规则同标准国际象棋
      </div>
    </div>
  </div>
</div>

<script>
const HILL = new Set(['d4','e4','d5','e5']);
const UNI = { w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'}, b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'} };
const VAL = { p:100, n:320, b:330, r:500, q:900, k:0 };
const FILES = 'abcdefgh';

let chess, selectedSq, legalSel, lastMv, gameOver, autoRun;
let gameMode = 'pvp'; // 'pvp' | 'pve'
let aiThinking = false;

function newGame() {
  chess = new Chess();
  selectedSq = null; legalSel = []; lastMv = null; gameOver = false;
  render(); updateStatus();
}

function rc2sq(r,c){ return FILES[c]+(8-r); }

function render() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  const bd = chess.board();
  const chk = chess.in_check();
  for (let r=0;r<8;r++) for (let c=0;c<8;c++) {
    const sq = document.createElement('div');
    sq.className = 'square '+((r+c)%2===0?'light':'dark');
    const sname = rc2sq(r,c);
    if (HILL.has(sname)) sq.classList.add('hill');
    if (lastMv && (lastMv.from===sname||lastMv.to===sname)) sq.classList.add('last-move');
    if (selectedSq===sname) sq.classList.add('selected');
    if (chk && bd[r][c] && bd[r][c].type==='k' && bd[r][c].color===chess.turn()) sq.classList.add('check');
    if (selectedSq) {
      const t = legalSel.find(m=>m.to===sname);
      if (t) {
        if (bd[r][c] || t.flags.includes('e')) {
          const ring=document.createElement('div'); ring.className='capture-ring'; sq.appendChild(ring);
        } else {
          const dot=document.createElement('div'); dot.className='dot'; sq.appendChild(dot);
        }
      }
    }
    if (bd[r][c]) {
      const pe=document.createElement('span');
      pe.className='piece '+bd[r][c].color;
      pe.textContent=UNI[bd[r][c].color][bd[r][c].type];
      sq.appendChild(pe);
    }
    if (c===0){const rk=document.createElement('span');rk.className='coord rank';rk.textContent=8-r;sq.appendChild(rk);}
    if (r===7){const fl=document.createElement('span');fl.className='coord file';fl.textContent=FILES[c];sq.appendChild(fl);}
    sq.onclick=()=>onClick(r,c,sname);
    el.appendChild(sq);
  }
}

function updateStatus() {
  document.getElementById('turnLabel').textContent = chess.turn()==='w'?'白方':'黑方';
  document.getElementById('moveCount').textContent = Math.ceil(chess.history().length/2);
}

function onClick(r,c,sname) {
  if (gameOver||autoRun||aiThinking) return;
  if (gameMode==='pve' && chess.turn()==='b') return; // 你执白，黑方是AI
  const cell = chess.board()[r][c];
  if (selectedSq) {
    const mv = legalSel.find(m=>m.to===sname);
    if (mv) { doMove(mv); return; }
    if (cell && cell.color===chess.turn()) { selectSq(sname); return; }
    selectedSq=null; legalSel=[]; render();
  } else if (cell && cell.color===chess.turn()) selectSq(sname);
}

function selectSq(s) {
  selectedSq=s;
  legalSel=chess.moves({square:s,verbose:true});
  render();
}

function doMove(mv) {
  const res = chess.move(mv);
  if (!res) return;
  lastMv = {from:res.from,to:res.to};
  selectedSq=null; legalSel=[];
  if (res.piece==='k' && HILL.has(res.to)) {
    gameOver=true; showRes(res.color,'hill'); render(); updateStatus(); return;
  }
  if (chess.in_checkmate()) { gameOver=true; showRes(res.color==='w'?'b':'w','checkmate'); }
  else if (chess.in_stalemate()) { gameOver=true; showRes(null,'stalemate'); }
  else if (chess.in_draw()) { gameOver=true; showRes(null,'draw'); }
  render(); updateStatus();
  // PvE模式：走完后AI执黑回应
  if (gameMode==='pve' && !gameOver) {
    aiThinking = true;
    setTimeout(()=>{
      const aiMv = chooseAI();
      if (aiMv) {
        const r = chess.move(aiMv);
        lastMv = {from:r.from,to:r.to};
        if (r.piece==='k' && HILL.has(r.to)) {
          gameOver=true; showRes(r.color,'hill');
        } else if (chess.in_checkmate()) {
          gameOver=true; showRes(r.color==='w'?'b':'w','checkmate');
        } else if (chess.in_stalemate()) { gameOver=true; showRes(null,'stalemate'); }
        else if (chess.in_draw()) { gameOver=true; showRes(null,'draw'); }
      }
      aiThinking = false;
      render(); updateStatus();
    }, 300);
  }
}

function showRes(w,reason) {
  const b=document.getElementById('resultBanner');
  let t='',cls='';
  if (w) {
    const n=w==='w'?'白方':'黑方';
    t = reason==='checkmate'?`将死！${n}获胜！`:`登顶！${n}的王踏上了山顶！`;
    cls = w==='w'?'win-w':'win-b';
  } else {
    t='和棋';
    if(reason==='stalemate')t+='（逼和）';
    if(reason==='draw')t+='（50回合/三次重复）';
    cls='draw';
  }
  b.textContent=t; b.className='result-banner '+cls;
}

// ===== AI =====
function evaluate() {
  const bd=chess.board(); let sc=0;
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const cell=bd[r][c]; if(!cell) continue;
    let v=VAL[cell.type];
    const sname=rc2sq(r,c);
    if(HILL.has(sname)){
      if(cell.type==='k') v+=1500; else v+=30;
    }
    if(cell.type==='k'){
      const d=Math.abs(r-3.5)+Math.abs(c-3.5);
      v-=d*20;
    }
    sc += cell.color==='w'?v:-v;
  }
  return sc;
}

function chooseAI() {
  const moves=chess.moves({verbose:true});
  if(!moves.length) return null;
  // 山顶直接赢
  for(const m of moves) if(m.piece==='k'&&HILL.has(m.to)) return m;
  // 将死直接赢
  for(const m of moves){ chess.move(m); const mate=chess.in_checkmate(); chess.undo(); if(mate) return m; }
  // 贪心评估
  const turn=chess.turn();
  let best=turn==='w'?-Infinity:Infinity, bests=[];
  for(const m of moves){
    chess.move(m);
    let sc=evaluate();
    if(chess.in_check()) sc += turn==='w'?-50:50;
    chess.undo();
    if(turn==='w'){
      if(sc>best){best=sc;bests=[m];} else if(sc===best)bests.push(m);
    } else {
      if(sc<best){best=sc;bests=[m];} else if(sc===best)bests.push(m);
    }
  }
  return bests[Math.floor(Math.random()*bests.length)];
}

// ===== 自动对局 =====
const stats={ww:0,bw:0,draw:0,mate:0,hill:0,total:0,games:0};
const logEl=document.getElementById('gamelog');
let logHtml='';
function addLog(h){ logHtml=h+logHtml; logEl.innerHTML=logHtml; }

async function runAI(n) {
  autoRun=true;
  document.getElementById('btnAI5').disabled=true;
  document.getElementById('btnStop').disabled=false;
  document.getElementById('btnNewGame').disabled=true;
  Object.assign(stats,{ww:0,bw:0,draw:0,mate:0,hill:0,total:0,games:0});
  logHtml=''; updateStats();
  for(let i=0;i<n;i++){
    if(!autoRun) break;
    const r=await playGame(i+1);
    stats.games++; stats.total+=r.moves;
    if(r.winner==='w')stats.ww++; else if(r.winner==='b')stats.bw++; else stats.draw++;
    if(r.reason==='checkmate')stats.mate++;
    if(r.reason==='hill')stats.hill++;
    updateStats();
    document.getElementById('progressFill').style.width=(stats.games/n*100)+'%';
    await sleep(150);
  }
  autoRun=false;
  document.getElementById('btnAI5').disabled=false;
  document.getElementById('btnStop').disabled=true;
  document.getElementById('btnNewGame').disabled=false;
  addLog('<div style="color:#e8c170">=== '+n+'局测试完成 ===</div>');
}

function playGame(gn) {
  return new Promise(res=>{
    newGame();
    let mc=0; const max=120;
    function step(){
      if(!autoRun){res({winner:null,reason:'stopped',moves:mc});return;}
      if(gameOver||mc>=max){
        if(mc>=max&&!gameOver){
          addLog('<div class="game-entry"><b>第'+gn+'局</b>：超过'+max+'步终止（和棋）· '+mc+'步</div>');
          res({winner:null,reason:'maxmoves',moves:mc});
        }
        return;
      }
      const mv=chooseAI();
      if(!mv){
        if(chess.in_checkmate()){gameOver=true;const w=chess.turn()==='w'?'b':'w';fin(w,'checkmate',mc,gn,res);}
        else{gameOver=true;fin(null,'stalemate',mc,gn,res);}
        return;
      }
      const r=chess.move(mv); mc++;
      lastMv={from:r.from,to:r.to};
      let w=null,reason=null;
      if(r.piece==='k'&&HILL.has(r.to)){w=r.color;reason='hill';gameOver=true;}
      else if(chess.in_checkmate()){w=r.color==='w'?'b':'w';reason='checkmate';gameOver=true;}
      else if(chess.in_stalemate()){reason='stalemate';gameOver=true;}
      else if(chess.in_draw()){reason='draw';gameOver=true;}
      render(); updateStatus();
      if(gameOver) fin(w,reason,mc,gn,res);
      else setTimeout(step,10);
    }
    step();
  });
}

function fin(w,reason,moves,gn,res){
  const wn=w?(w==='w'?'白方':'黑方'):'和棋';
  let rt='';
  if(reason==='checkmate')rt='将死';
  else if(reason==='hill')rt='登顶';
  else if(reason==='stalemate')rt='逼和';
  else if(reason==='draw')rt='50回合/三次重复';
  addLog('<div class="game-entry"><b>第'+gn+'局</b>：'+wn+'胜（'+rt+'）· '+moves+'步</div>');
  res({winner:w,reason,moves});
}

function updateStats(){
  document.getElementById('statWW').textContent=stats.ww;
  document.getElementById('statBW').textContent=stats.bw;
  document.getElementById('statDraw').textContent=stats.draw;
  document.getElementById('statMate').textContent=stats.mate;
  document.getElementById('statHill').textContent=stats.hill;
  document.getElementById('statAvgMoves').textContent=stats.games?(stats.total/stats.games).toFixed(1):'-';
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

newGame();
